<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nothing Here</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: red;
            /* Impact 是很經典的粗體，沒有的話會用 Arial Black */
            font-family: "Impact", "Arial Black", sans-serif; 
            font-size: 5em; /* 字體再加大 */
            text-transform: uppercase; /* 強制全大寫，看起來比較兇 */
            letter-spacing: 3px; /* 字距稍微拉開，增加氣勢 */
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>NO MORE.</h1>

</body>
</html>
